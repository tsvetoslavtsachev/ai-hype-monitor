name: Deploy to GitHub Pages

on:
  # САМО ръчно (08.11.2026). Това е деплоят на v1 (качва ./app). Сайтът е на legacy Pages
  # от main/docs (v2). Push тригерът върху app/** се надбягваше с pages-build-deployment
  # (24.07 и двата тръгнаха в една минута) и седмичният v2 рън пише в app/data, тоест
  # всеки седмичен комит рискуваше да върне v1 на главния адрес.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
