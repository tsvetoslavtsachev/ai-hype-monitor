name: Weekly v2 — каишката

# Седмичната рутина на v2 (сгъвката „Рутината“ на живото лице), автоматизирана 08.11.2026.
# Статусът на пукнатините T1-T13 остава САМО ръчен; тук не се пипа.
# Ред: цени (price-archive, при липса yfinance; за акциите със split_factor, ПРОЛЕТР9) → фундамент (SEC XBRL) →
# двете стрелки (ПРОЛЕТР9, 27.11.2026; старите гласове, E, G, зоната и лицето са замразени).
# Сайтът е legacy Pages от main/docs: комитът тук е деплоят.
#
# pull_request = сух рън (всичко без комита), за да се проверява конвейерът преди сливане.

on:
  schedule:
    # Събота: след петъчното затваряне в price-archive.
    # ИЛЮ3 В2 (22.11.2026): съботният ценови ход е в 13:37 UTC (европейският петък); резервата
    # на четците е след него. В събота с диригента този ход е втори и не пише нищо ново.
    - cron: '7 15 * * 6'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/weekly_v2.yml'

permissions:
  contents: write

concurrency:
  group: weekly-v2
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout ai-hype-monitor
        uses: actions/checkout@v5
        with:
          path: ai-hype-monitor

      - name: Checkout price-archive (ETF цените)
        uses: actions/checkout@v5
        with:
          repository: tsvetoslavtsachev/price-archive
          path: price-archive
          token: ${{ secrets.PRICE_ARCHIVE_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          pip install --upgrade pip
          pip install -r ai-hype-monitor/requirements.txt pyyaml pytest

      - name: Цени (история + файлове по символ)
        working-directory: ai-hype-monitor
        run: |
          python src/backfill_prices.py --price-archive-root ../price-archive
          python src/split_price_history.py

      - name: Фундамент (SEC XBRL, point-in-time)
        working-directory: ai-hype-monitor
        env:
          # ПРОЛЕТР9: идентификацията пред SEC идва от тайната, не от кода (src/v2/sec_ua.py).
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python src/v2/collect_xbrl.py

      # ПРОЛЕТР9 (27.11.2026): гласовете на еуфорията, E, G, зоните, едностраничникът и лицето
      # (старото е в docs/arhiv/2026-11-20/) са замразени по решение на Ц.; виж src/v2/FROZEN.md.
      # docs/index.html от 27.11.2026 е новата публична страница на двете стрелки (strelki_site.py).
      # Живи са източниците
      # на двете стрелки: froth (S-1 делът), ai_words (AI думите в резултатите, третата съставка на
      # историята по решението на Ц. „Само думите“, 27.11.2026; SEC се пита веднъж на тримесечие)
      # и multiple_v2 (P/S по име), плюс фактите горе.
      - name: Източниците на стрелките (S-1 делът, AI думите, P/S по име)
        working-directory: ai-hype-monitor
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python src/v2/froth.py
          python src/v2/ai_words.py
          python src/v2/multiple_v2.py

      - name: Двете стрелки (out/weekly/<събота>.json и .md, серията, публичната страница)
        id: face
        working-directory: ai-hype-monitor
        run: |
          d=$(python src/v2/strelki.py --print-saturday)
          python src/v2/strelki.py "$d"
          # публичната страница (решение на Ц. „Публичен сайт“, 27.11.2026): docs/index.html и данните
          python src/v2/strelki_site.py "$d"
          echo "asof=$d" >> "$GITHUB_OUTPUT"

      - name: Тестове
        working-directory: ai-hype-monitor
        run: python -m pytest -q tests

      - name: Комит (= деплой на лицето)
        if: github.event_name != 'pull_request'
        working-directory: ai-hype-monitor
        run: |
          git config user.name  "weekly-v2"
          git config user.email "actions@users.noreply.github.com"
          git add app/data docs out
          if git diff --cached --quiet; then
            echo "без промяна, нищо за комитване"
          else
            git commit -m "v2 weekly: ${{ steps.face.outputs.asof }}"
            git push
          fi
